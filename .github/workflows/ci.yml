name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ALLOW_LIVE_READS: 'false'
  ALLOW_AI_PROCESSING: 'false'

jobs:
  checks:
    name: Python and PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.12.23
          uv sync --frozen --extra dev
      - name: Lint and formatting
        run: |
          uv run --frozen --extra dev ruff check .
          uv run --frozen --extra dev ruff format --check .
          git diff --check
      - name: Tests and PostgreSQL restart recovery
        run: uv run --frozen --extra dev python tools/test_postgres.py

  container:
    name: Docker offline smoke
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Build production Dockerfile
        run: docker build --tag aissistant:ci --file Dockerfile .
      - name: Offline cycles, persistent state, permissions and shutdown
        run: python tools/test_container.py --image aissistant:ci
