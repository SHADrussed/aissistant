name: Cloudflare bridge

on:
  push:
    branches: [main, 'feature/**']
    paths: ['cloudflare/**', '.github/workflows/cloudflare.yml']
  pull_request:
    paths: ['cloudflare/**', '.github/workflows/cloudflare.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Local migrations are repeatable
        run: |
          npm run migrate:local
          npm run migrate:local
      - name: Personal-device registration tests (no network)
        run: python3 -m unittest discover -s test -p 'test_*.py'
      - run: git diff --check
