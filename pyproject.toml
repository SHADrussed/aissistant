[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aissistant"
version = "0.1.0"
description = "Private opt-in AI secretary worker"
requires-python = ">=3.12,<3.13"
dependencies = [
  "telethon>=1.38,<2", "openai>=1.60,<3", "google-auth>=2.37,<3",
  "httpx>=0.28,<1", "requests>=2.32,<3", "sqlalchemy>=2.0.36,<3",
  "psycopg[binary]>=3.2,<4", "pydantic>=2.10,<3", "alembic>=1.14,<2",
]

[project.optional-dependencies]
local-auth = ["google-auth-oauthlib>=1.2,<2"]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1"]

[project.scripts]
aissistant = "aissistant.main:main"
aissistant-db = "aissistant.database:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
